<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home-Superior</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Advent+Pro:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <!-- Cabeçalho -->
    <nav class="navbar">
        <div class="title">
            <p class="title-text">Catálogo de Imoveis</p>
            <span class="title-subtext">Cuidado e Exclusividade</span>
        </div>
        <div class="navsand">
            <img src="assets/icons/sandmenu.svg" class="iconsand" alt="">
        </div>
    </nav>
    <section class="body">
        <!-- Imagem do Corpo -->
        <div class="body-img"><img src="assets/images/casa.jpg" alt="" class="body-img-config"></div>
        <!-- Começo do Body Text "Encontre seu Imovel" -->
        <div class="imovel-ideal">
            <p class="imovel-ideal-text">Encontre o Imóvel Ideal</p>
            <span class="imovel-ideal-subtext">Selecione os tipos de Imóveis que você procura.</span>
        </div>
        <section class="cards">
        <div class="containercards">
            <div class="vip">
                <img src="assets/icons/diamondicon.svg" alt="" class="diamondicon">
                Imóveis Vip
            </div>
          
            <div class="coontainercards2">
              <div class="card">
                <img src="assets/icons/apartmenticon.svg" alt="" class="apartmenticon">
                Apartamentos 
            </div>
              <div class="card">
                <img src="assets/icons/houseicon.svg" alt="" class="houseicon">
                Casas
                </div>
              <div class="card">
                <img src="assets/icons/layersicon.svg" alt="" class="layersicon">
                    Terrenos 
            </div>
          </div>
        </section>
        <div class="filtro">busca avançada</div>
          
    </section>
</body>

</html>
