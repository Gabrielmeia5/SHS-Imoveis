<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="styles/destaque.css">
    <link rel="stylesheet" href="styles/catalogo.css">
</head>

<body>
    <section id="destaque">
        <div class="destaque_titulo">
            <h1>Imóveis em destaque</h1>
            <p>Conheça algumas das melhores oportunidades de negócios de imóveis de Patos de Minas.</p>
        </div>
        <div class="destaque_buttons">
            <div class="setae"><img src="assets/images/setae.svg"></div>
            <div class="setad"><img src="assets/images/setad.svg"></div>
        </div>
        <div class="destaque_imoveis">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">1</div>
                    <div class="swiper-slide">2</div>
                    <div class="swiper-slide">3</div>
                    <div class="swiper-slide">4</div>
                    <div class="swiper-slide">5</div>
                    <div class="swiper-slide">6</div>
                    <div class="swiper-slide">7</div>
                    <div class="swiper-slide">8</div>
                    <div class="swiper-slide">9</div>
                    <div class="swiper-slide">10</div>
                </div>
            </div>
        </div>
    </section>
    <section id="catalogo">
        <div class="catalogo_titulo">
            <h1>Catálogo de Imóveis</h1>
        </div>
        <div class="card_imoveis">
            <div class="card">1</div>
            <div class="card">2</div>
            <div class="card">3</div>
            <div class="card">4</div>
            <div class="card">5</div>
            <div class="card">6</div>
            <div class="card">7</div>
            <div class="card">8</div>
            <div class="card">9</div>
            <div class="card">10</div>
            <div class="card">11</div>
            <div class="card">12</div>
            <div class="card">13</div>
            <div class="card">14</div>
            <div class="card">15</div>
        </div>
        <div class="verMais">
            <button id="verMaisBtn">VER MAIS</button>
        </div>
    </section>
</body>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="scripts/destaque.js"></script>
<script src="scripts/catalogo.js"></script>
</html>
