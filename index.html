<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="styles/destaque.css">
</head>

<body>
    <section id="destaque">
        <div class="destaque_titulo">
            <h1>Imóveis em destaque</h1>
            <p>Conheça algumas das melhores oportunidades<br>de negócios de imóveis de Patos de Minas.</p>
        </div>
        <div class="destaque_buttons">
            <div class="setae"><img src="assets/images/setae.svg"></div>
            <div class="setad"><img src="assets/images/setad.svg"></div>
        </div>
        <div class="destaque_imoveis">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">Slide 1</div>
                    <div class="swiper-slide">Slide 2</div>
                    <div class="swiper-slide">Slide 3</div>
                    <div class="swiper-slide">Slide 4</div>
                    <div class="swiper-slide">Slide 5</div>
                    <div class="swiper-slide">Slide 6</div>
                    <div class="swiper-slide">Slide 7</div>
                    <div class="swiper-slide">Slide 8</div>
                    <div class="swiper-slide">Slide 9</div>
                </div>
            </div>
        </div>
    </section>
</body>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="scripts/destaque.js"></script>

</html>
